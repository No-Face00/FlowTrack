name: flow_track
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.0.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  lottie: ^3.3.2
  go_router: ^14.2.7
  shared_preferences: ^2.5.4
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.5
  flutter_facebook_auth: ^7.0.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  intl: ^0.20.2
  path_provider: ^2.1.5
  get_it: ^9.2.1
  shimmer: ^3.0.0
  google_generative_ai: ^0.4.7
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^12.0.2
  fl_chart: ^0.68.0

dev_dependencies:
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Lottie animation icons
    - assets/icons/AI_Assist.json
    - assets/icons/Data_Analysis.json
    - assets/icons/Wallet_animation.json
    - assets/icons/Security.json
    # Noto Sans fonts for PDF Unicode rendering (Bengali, Arabic, etc.)
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf